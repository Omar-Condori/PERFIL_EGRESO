site_name: Documentos oficiales de la Escuela de Sistemas
site_description: Proyecto Evaluación de fin de carrera 2026 — UPeU Campus Juliaca
site_url: https://omar-condori.github.io/PERFIL_EGRESO/
repo_url: https://github.com/Omar-Condori/PERFIL_EGRESO
repo_name: Omar-Condori/PERFIL_EGRESO
theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: indigo
  features: [navigation.top, navigation.indexes, search.highlight, toc.follow]
  icon:
    repo: fontawesome/brands/github
plugins: [search]
markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Inicio: index.md
  - 'CE02: Ingeniería de Software':
    - ce02/index.md
    - 'CE021 - S1 - E1: Requerimientos y Diseño del Sistema': ce02/e1-requerimientos-y-diseno.md
    - 'CE022 - S2 - E2: Plataforma de Datos del Sistema': ce02/e2-plataforma-de-datos.md
    - 'CE023 - S2 - E3: Sistema de Software Funcional Integrado': ce02/e3-sistema-funcional-integrado.md
    - 'CE024 - S2 - E4: Gestión del Proyecto y Calidad de Software': ce02/e4-gestion-proyecto-y-calidad.md
  - 'CE03: Infraestructura Tecnológica':
    - ce03/index.md
    - 'CE0311 - S1 - E1: Análisis y Diseño de Red': ce03/s1-e1-analisis-y-diseno-de-red.md
    - 'CE0331 - S1 - E2: Análisis y Diseño de Centro de Datos Híbrido': ce03/s1-e2-diseno-centro-de-datos.md
    - 'CE0321-CE0324 - S2 - E1: Planificación e Implementación del SGSI': ce03/s2-e1-sgsi.md
    - 'CE0312-CE0313 - S2 - E2: Implementación, Testing y Monitoreo de Red': ce03/s2-e2-implementacion-testing-monitoreo.md
    - 'CE0332-CE0333 - S2 - E3: Implementación, Gestión y Control de Centro de Datos': ce03/s2-e3-centro-de-datos.md
    - 'Producto final S2: Informe Integral y Operativo': ce03/s2-producto-final.md
